<?xml version="1.0" encoding="UTF-8"?>
<!-- KPI — Bars Only (no hexagon, no letters)
     The pure data mark. Use as: favicon, watermark, inline brand pulse.
     Three ascending bars = "data going up" = the entire KPI story. -->
<svg viewBox="0 0 60 80" xmlns="http://www.w3.org/2000/svg">
  <rect x="2"  y="48" width="16" height="30" rx="2" fill="#1B4F72"/>
  <rect x="22" y="28" width="16" height="50" rx="2" fill="#2D8BBA"/>
  <rect x="42" y="8"  width="16" height="70" rx="2" fill="#A8D14E"/>
</svg>
